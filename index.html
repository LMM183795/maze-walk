<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>走迷宫</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="brand">走迷宫</div>
        <div class="stats">
          <span><strong id="difficulty-label">标准</strong> · 第 <strong id="level">1</strong> 关</span>
          <span>步数 <strong id="steps">0</strong></span>
          <span>用时 <strong id="timer">0.0</strong>s</span>
        </div>
        <button id="restart-btn" class="icon-btn" type="button" aria-label="重新开始" title="重新开始" hidden>↻</button>
      </header>
      <main class="stage">
        <canvas id="maze" aria-label="迷宫"></canvas>
        <div id="overlay" class="overlay">
          <div class="card">
            <p class="eyebrow">MAZE WALK</p>
            <h1>走迷宫</h1>
            <p class="lede">轻点走一步，按住鼠标朝指针方向连续移动；方向键 / WASD 按住也能连续移动。手机可滑动或使用屏幕按钮。</p>
            <div class="difficulty" role="group" aria-labelledby="difficulty-title">
              <div class="difficulty-title" id="difficulty-title">难度</div>
              <div class="difficulty-options" id="difficulty-options">
                <button type="button" data-difficulty="easy" aria-pressed="false">轻松</button>
                <button type="button" data-difficulty="normal" aria-pressed="true">标准</button>
                <button type="button" data-difficulty="hard" aria-pressed="false">挑战</button>
              </div>
              <p class="difficulty-hint" id="difficulty-hint">第 1 关 11 × 9，经典尺寸，稳步变大</p>
            </div>
            <button id="start-btn" type="button">开始探索</button>
            <button id="reselect-btn" class="ghost-btn" type="button" hidden>重新选择难度</button>
          </div>
        </div>
      </main>
      <nav class="pad" aria-label="方向键">
        <button data-dir="up" type="button">↑</button>
        <div class="pad-mid">
          <button data-dir="left" type="button">←</button>
          <button data-dir="down" type="button">↓</button>
          <button data-dir="right" type="button">→</button>
        </div>
      </nav>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
